name: ROS

on:
  push:
  pull_request:

jobs:
  container:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container:
      image: ros:humble-ros-base-jammy@sha256:d9bcf2e6f72df127fdee07048c2e87b1b4b9a59a74af0592f4489fc2844aa855
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure BehaviorTree.CPP 4.11.0
        run: |
          set -euo pipefail
          chmod +x ros2/scripts/ensure_btcpp_4_11.sh
          apt-get update
          apt-get install -y git libssl-dev
          if ! ros2/scripts/ensure_btcpp_4_11.sh; then
            exit 1
          fi
          if [ -d /opt/btcpp-4.11 ]; then
            echo "CMAKE_PREFIX_PATH=/opt/btcpp-4.11:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          fi
          apt_ver=$(dpkg-query -W -f='${Version}' ros-humble-behaviortree-cpp 2>/dev/null || true)
          if [ -n "$apt_ver" ] && [[ "$apt_ver" == 4.11.0* ]]; then
            echo "CI using apt BT.CPP $apt_ver"
          elif [ -d /opt/btcpp-4.11 ]; then
            echo "CI using FetchContent install at /opt/btcpp-4.11"
          else
            echo "Neither apt nor FetchContent yielded BT.CPP 4.11.0" >&2
            exit 1
          fi

      - name: rosdep and build
        run: |
          set -eo pipefail
          apt-get update
          apt-get install -y python3-pip
          set +u
          source /opt/ros/humble/setup.bash
          set -u
          cd ros2
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y
          colcon build --packages-select nav2_bt_mission --cmake-args -DCMAKE_BUILD_TYPE=Release
          set +u
          source install/setup.bash
          colcon test --packages-select nav2_bt_mission --event-handlers console_direct+
          colcon test-result --verbose
