name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Authorship (criterion 23)
        run: |
          set -euo pipefail
          bad=0
          while read -r sha; do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            committer=$(git log -1 --format='%cn <%ce>' "$sha")
            if [ "$author" != "Arpan Bom <applycoding@gmail.com>" ] || \
               [ "$committer" != "Arpan Bom <applycoding@gmail.com>" ]; then
              echo "unexpected author/committer on $sha: $author | $committer"
              bad=1
            fi
            body=$(git log -1 --format='%b' "$sha")
            if echo "$body" | grep -qi 'Co-authored-by'; then
              echo "Co-authored-by trailer on $sha"
              bad=1
            fi
          done < <(git rev-list --no-merges origin/main..HEAD 2>/dev/null || git rev-list --no-merges HEAD)
          exit "$bad"

      - name: Toolchain versions
        run: |
          g++-13 --version | head -1
          cmake --version | head -1

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Configure and test
        run: |
          cmake --preset default
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Generate traces
        run: |
          set -euo pipefail
          mkdir -p traces/ci
          for s in nominal low_battery critical_battery blocked_corridor \
            phantom_obstacle stuck unreachable_zone lane_obstacle lane_blocked_perm; do
            mkdir -p "traces/ci/$s"
            ./build/bt_mission --scenario "$s" --tree trees/mission.xml \
              --out "traces/ci/$s"
          done

      - name: Golden hashes
        run: |
          set -euo pipefail
          if grep -qE '^[0-9a-f]{64}' traces/golden.sha256 2>/dev/null; then
            while read -r hash path; do
              [ -z "$hash" ] && continue
              test_path="traces/ci/${path#traces/}"
              test_path="${test_path%.jsonl}"
              if [ -f "$test_path/trace.jsonl" ]; then
                echo "$hash  $test_path/trace.jsonl" | sha256sum -c -
              fi
            done < traces/golden.sha256
          else
            echo "golden.sha256 placeholder; skipping compare"
          fi

      - name: Python trace schema (criterion 20)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: pytest
        run: |
          python -m pip install --require-hashes -r python/requirements.txt
          python -m pytest python/test_trace_schema.py -v

      - name: Web typecheck and unit tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: npm test
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Upload traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces
          path: traces/ci
