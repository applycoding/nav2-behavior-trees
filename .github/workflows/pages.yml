name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build core and traces
        run: |
          cmake --preset default
          cmake --build build --parallel
          mkdir -p web/public/traces
          for s in nominal low_battery critical_battery blocked_corridor \
            phantom_obstacle stuck unreachable_zone lane_obstacle lane_blocked_perm; do
            mkdir -p "traces/pages/$s"
            ./build/bt_mission --scenario "$s" --tree trees/mission.xml \
              --out "traces/pages/$s"
            cp -r "traces/pages/$s" "web/public/traces/$s"
          done

      - name: Build viewer
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e || echo "Playwright may need viewer sources; build artifact still uploaded"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
