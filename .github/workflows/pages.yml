name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev

      - name: Build core, test, and regenerate traces
        run: |
          set -euo pipefail
          cmake --preset default
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          mkdir -p traces/pages
          for s in nominal low_battery critical_battery blocked_corridor \
            phantom_obstacle stuck unreachable_zone lane_obstacle lane_blocked_perm; do
            mkdir -p "traces/pages/$s"
            ./build/bt_mission --scenario "$s" --tree trees/mission.xml \
              --out "traces/pages/$s"
          done
          trace_count=0
          metrics_count=0
          while read -r hash path; do
            [ -z "$hash" ] && continue
            case "$path" in
              traces/*/trace.jsonl)
                scenario="${path#traces/}"
                scenario="${scenario%/trace.jsonl}"
                test_path="traces/pages/${scenario}/trace.jsonl"
                ;;
              traces/*/metrics.json)
                scenario="${path#traces/}"
                scenario="${scenario%/metrics.json}"
                test_path="traces/pages/${scenario}/metrics.json"
                ;;
              *) continue ;;
            esac
            echo "$hash  $test_path" | sha256sum -c -
            case "$path" in
              traces/*/trace.jsonl) trace_count=$((trace_count + 1)) ;;
              traces/*/metrics.json) metrics_count=$((metrics_count + 1)) ;;
            esac
          done < traces/golden.sha256
          if [ "$trace_count" -ne 9 ] || [ "$metrics_count" -ne 9 ]; then
            echo "expected 9 trace and 9 metrics golden comparisons, got $trace_count and $metrics_count"
            exit 1
          fi
          mkdir -p web/public/traces
          for s in nominal low_battery critical_battery blocked_corridor \
            phantom_obstacle stuck unreachable_zone lane_obstacle lane_blocked_perm; do
            rm -rf "web/public/traces/$s"
            cp -r "traces/pages/$s" "web/public/traces/$s"
          done

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Build viewer and Playwright
        working-directory: web
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run copy-traces
          node scripts/write-report.mjs
          npm run build
          npm run test:e2e

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
